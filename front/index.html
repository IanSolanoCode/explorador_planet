<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#14151C" />
  <title>Explorador Planet</title>
  <script>
    // Fija el tema antes de pintar para evitar parpadeo. Sin dependencias.
    try {
      var t = localStorage.getItem('explorador-planet:tema');
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <link rel="stylesheet" href="/main.css" />
</head>
<body>
  <div id="globe"></div>
  <aside id="sidebar">
    <div id="country-info" class="hidden">
      <h3 id="country-name"></h3>
      <p id="country-code"></p>
    </div>
  </aside>
  <nav id="toolbar">
    <button class="tab-btn active" data-tab="radio">Radio</button>
    <button class="tab-btn" data-tab="tv">TV</button>
    <button id="btn-tema" class="btn-icono" type="button" aria-label="Cambiar a modo claro">
      <svg class="icono-tema icono-sol" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <svg class="icono-tema icono-luna" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="currentColor"/></svg>
    </button>
    <button id="btn-favoritos" class="tab-btn accion-btn" type="button" aria-pressed="false">Mis favoritos</button>
    <div id="cuenta" class="cuenta">
      <button id="btn-cuenta" class="tab-btn cuenta-btn" type="button" aria-haspopup="menu" aria-expanded="false">Entrar</button>
      <div id="menu-cuenta" class="cuenta-menu" role="menu" hidden>
        <button id="btn-salir" class="cuenta-salir" type="button" role="menuitem">Salir</button>
      </div>
    </div>
  </nav>
  <script type="module" src="/main.js"></script>
</body>
</html>
